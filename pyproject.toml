[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru_vl_utils"
dynamic = ["version"]
authors = [
  { name="Jin Zhen Jiang", email="jinzhenjiang@pjlab.org.cn" },
  { name="Zhao Xiao Meng", email="zhaoxiaomeng@pjlab.org.cn" },
  { name="Zhao Zhi Yuan", email="zhaozhiyuan@pjlab.org.cn" },
]
description = "Utilities for MinerU Vision-Language models"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpx",
    "httpx-retries",
    "aiofiles",
    "pillow>=11.0.0",
    "pydantic>=2.12.5,<3",
    "loguru>=0.7.2",
    "tqdm>=4.67.1",
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/opendatalab/mineru-vl-utils"
Issues = "https://github.com/opendatalab/mineru-vl-utils/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
transformers = [
    "torch>=2.6.0,<3",
    "transformers>=5.10.1,<6",
    "accelerate>=1.5.1",
    "torchvision",
]
vllm = [
    "vllm>=0.19.1,<0.31.0",
]
mlx = [
    "mlx-vlm>=0.7.0,<0.8.0",
]
lmdeploy = [
    "lmdeploy>=0.17.0,<0.19",
    "qwen-vl-utils>=0.0.14,<1",
]
llama-cpp = [
    "mineru-llama-cpp>=0.2.1,<1",
]

[tool.setuptools.dynamic]
version = { attr = "mineru_vl_utils.version.__version__" }

[tool.setuptools.packages.find]
include = ["mineru_vl_utils*"]

[tool.black]
line-length = 128

[tool.ruff]
line-length = 128
